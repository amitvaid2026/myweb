<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .contact-container {
            background: #fff;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
            display: flex;
            overflow: hidden;
        }

        /* Left Side: Info */
        .contact-info {
            background: #2c3e50;
            color: #fff;
            padding: 40px;
            width: 40%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .contact-info h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .info-details p {
            margin: 15px 0;
            font-size: 15px;
            line-height: 1.5;
        }

        /* Right Side: Form */
        .contact-form-wrapper {
            padding: 40px;
            width: 60%;
        }

        .contact-form-wrapper h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #7f8c8d;
            font-size: 14px;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 4px;
            outline: none;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: #3498db;
        }

        .form-group textarea {
            height: 120px;
            resize: none;
        }

        .submit {
            background: #3498db;
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background: #2980b9;
        }

        /* Responsive Breakpoint */
        @media (max-width: 768px) {
            .contact-container {
                flex-direction: column;
            }
            .contact-info, .contact-form-wrapper {
                width: 100%;
                padding: 30px;
            }
        }
    </style>
</head>
<body>
<table align="center">
<tr>
<td align="center"><a href="index.html">Home</a></td>
</tr>
</table>
    <div class="contact-container">
        <!-- Contact Information Pane -->
        <div class="contact-info">
            <div>
                <h2>Get In Touch</h2>
                <div class="info-details">
                    <p><strong>📍 Address:</strong><br>Vinod Puri, Near Dashrath Puri Metro<br>New Delhi, 110045</p>
                    <p><strong>📞 Phone:</strong><br>+91-9711004147</p>
                    <p><strong>✉️ Email:</strong><br>contact.sendmychoice@gmail.com</p>
                </div>
            </div>
            <p style="font-size: 12px; color: #bdc3c7;">© 2026 SendMyChoice. All rights reserved.</p>
        </div>

        <!-- Contact Form Pane -->
        <div class="contact-form-wrapper">
            <h2>Send a Message</h2>
            <!-- Update the action URL with your form handler service -->
            <form action="mailto:contact.sendmychoice@gmail.com" method="POST">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="Amit Vaid">
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="amit@example.com">
                </div>
                
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" required placeholder="How can we help you?"></textarea>
                </div>
                
                <button type="submit" class="submit">Send Message</button>
            </form>
        </div>
    </div>

</body>
</html>
