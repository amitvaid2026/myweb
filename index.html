<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send My Choice - Making Shopping Easier</title>
    <style>
        .selector-container {
            font-family: Arial, sans-serif;
            margin: 50px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        select, button {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #B87E6E;
            color: white;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background-color: #724C41;
        }
    </style>
</head>
<body style="background-color: #FCE5E5;">
<table align="center" border: 1px solid black;>
  <tr>
    <td align="center"><br><br><br><br><br><br><br><img src="Sendmychoice_Front_logo.png" alt="Send my Choice"></td>
  </tr>
<tr>
<td><div class="selector-container">
    <!-- Country Dropdown -->
    <select id="country" onchange="updateStates()">
        <option value="">Select Country</option>
        <!-- <option value="US">United States</option> --->
        <option value="IN">India</option>
    </select>
    <!-- State Dropdown -->
    <select id="state" onchange="updateCategories()" disabled>
        <option value="">Select State</option>
    </select>

    <!-- Category Dropdown -->
    <select id="category" onchange="updateCompanies()" disabled>
        <option value="">Select Category</option>
    </select>

    <!-- Area Dropdown -->
    <select id="company" onchange="enableGoButton()" disabled>
        <option value="">Select Company</option>
    </select>

    <!-- Go Button -->
    <button id="goBtn" onclick="navigateToUrl()" disabled>Go</button>
</div></td>
</tr>
<tr>
<td align="center"><br><br><br><br><br><br><a href="contact.html">Contact Us</a></td>
</tr>
<tr>
<td align="center"><br>hosting By&nbsp;&nbsp;<a href="https://github.com/">GitHub</a></td>
</tr>
</table>


<script>
// Hierarchical data structure with final destination URLs
const locationData = {
    "IN": {
        "Delhi": {
"Ayurvedic & Herbals": {
                "Vaidyak Ayurveda": "https://vaidyakayurveda.com/"
            },
"Electrohomeopathy": {
                "Vaidyak Ayurveda": "https://vaidyakayurveda.com/"
            },
"Groceries": {
                "SHRINI": "https://www.shri-ni.com/"
            },
"Artificial Jewellery": {
                "Company Name": "http://sendmychoice.com",
            },
"Electronics": {
                "Company Name": "http://sendmychoice.com"
            },
"Gifts": {
                "Company Name": "http://sendmychoice.com"
            },
"Toys": {
                "Company Name": "http://sendmychoice.com"
            },
"Cosmetics & Accessories": {
                "Company Name": "http://sendmychoice.com"
            },
"Computer & Accessories": {
                "Company Name": "http://sendmychoice.com"
            },
"Garments & Apparels": {
                "Company Name": "http://sendmychoice.com"
            },
"Medical Equipment": {
                "Company Name": "http://sendmychoice.com"
            },
"Books": {
                "SQL Server Books": "http://sendmychoice.com"
            },
"Pickles": {
                "Company Name": "http://sendmychoice.com"
            },
"Furniture & Crafts": {
                "Company Name": "http://sendmychoice.com"
            },
"Photo Frame": {
                "Company Name": "http://sendmychoice.com"
            },
"Purse & Bags": {
                "Company Name": "http://sendmychoice.com"
            }

        }

    }
};

const countrySelect = document.getElementById("country");
const stateSelect = document.getElementById("state");
const categorySelect = document.getElementById("category");
const companySelect = document.getElementById("company");
const goBtn = document.getElementById("goBtn");

// Reset helper function
function resetDropdown(dropdown, placeholder) {
    dropdown.innerHTML = `<option value="">${placeholder}</option>`;
    dropdown.disabled = true;
}

// 1. Update States based on Country
function updateStates() {
    resetDropdown(stateSelect, "Select State");
    resetDropdown(categorySelect, "Select Category");
    resetDropdown(companySelect, "Select Company");
    goBtn.disabled = true;

    const selectedCountry = countrySelect.value;
    if (selectedCountry && locationData[selectedCountry]) {
        stateSelect.disabled = false;
        Object.keys(locationData[selectedCountry]).forEach(state => {
            stateSelect.options[stateSelect.options.length] = new Option(state, state);
        });
    }
}

// 2. Update Cities based on State
function updateCategories() {
    resetDropdown(categorySelect, "Select Category");
    resetDropdown(companySelect, "Select Company");
    goBtn.disabled = true;

    const selectedCountry = countrySelect.value;
    const selectedState = stateSelect.value;

    if (selectedState && locationData[selectedCountry][selectedState]) {
        categorySelect.disabled = false;
        Object.keys(locationData[selectedCountry][selectedState]).forEach(category => {
            categorySelect.options[categorySelect.options.length] = new Option(category, category);
        });
    }
}

// 3. Update Companies based on Category
function updateCompanies() {
    resetDropdown(companySelect, "Select Company");
    goBtn.disabled = true;

    const selectedCountry = countrySelect.value;
    const selectedState = stateSelect.value;
    const selectedCategory = categorySelect.value;

    if (selectedCategory && locationData[selectedCountry][selectedState][selectedCategory]) {
        companySelect.disabled = false;
        Object.keys(locationData[selectedCountry][selectedState][selectedCategory]).forEach(company => {
            companySelect.options[companySelect.options.length] = new Option(company, company);
        });
    }
}

// 4. Enable Go Button when company is selected
function enableGoButton() {
    if (companySelect.value) {
        goBtn.disabled = false;
    } else {
        goBtn.disabled = true;
    }
}

// 5. Redirect to the URL mapped to the selected Company
function navigateToUrl() {
    const selectedCountry = countrySelect.value;
    const selectedState = stateSelect.value;
    const selectedCategory = categorySelect.value;
    const selectedCompany = companySelect.value;

    const targetUrl = locationData[selectedCountry][selectedState][selectedCategory][selectedCompany];
    
    if (targetUrl) {
        window.location.href = targetUrl; // Use window.open(targetUrl, '_blank') to open in a new tab
    }
}
</script>

</body>
</html>
