<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Location Selector</title>
    <style>
        .selector-container {
            font-family: Arial, sans-serif;
            margin: 50px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        select, button {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<table align="center" border: 1px solid black;>
  <tr>
    <td><br><br><br><br><br><br><br><img src="Sendmychoice_Front_logo.png" alt="Send my Choice"></td>
  </tr>
<tr>
<td><div class="selector-container">
    <!-- Country Dropdown -->
    <select id="country" onchange="updateStates()">
        <option value="">Select Country</option>
        <!-- <option value="US">United States</option> --->
        <option value="IN">India</option>
    </select>

    <!-- State Dropdown -->
    <select id="state" onchange="updateCities()" disabled>
        <option value="">Select State</option>
    </select>

    <!-- City Dropdown -->
    <select id="city" onchange="updateAreas()" disabled>
        <option value="">Select City</option>
    </select>

    <!-- Area Dropdown -->
    <select id="area" onchange="enableGoButton()" disabled>
        <option value="">Select Area</option>
    </select>

    <!-- Go Button -->
    <button id="goBtn" onclick="navigateToUrl()" disabled>Go</button>
</div></td>
</tr>
<tr>
<td align="center"><br><br><br><br><br><br><a href="https://sendmychoice.blogspot.com/p/contact.html">Contact</a></td>
</tr>
</table>


<script>
// Hierarchical data structure with final destination URLs
const locationData = {
    "IN": {
        "Delhi": {
            "Artificial Jewellery": {
                "Company Name": "http://sendmychoice.com",
            },
            "Ayurvedic & Herbals": {
                "Company Name": "http://sendmychoice.com"
            },
"Medical Equipment": {
                "Company Name": "http://sendmychoice.com"
            },
"Electronics": {
                "Company Name": "http://sendmychoice.com"
            },
"Gifts": {
                "Company Name": "http://sendmychoice.com"
            },
"Toys": {
                "Company Name": "http://sendmychoice.com"
            },
"Cosmetics & Accessories": {
                "Company Name": "http://sendmychoice.com"
            },
"Computer & Accessories": {
                "Company Name": "http://sendmychoice.com"
            },
"Garments & Apparels": {
                "Company Name": "http://sendmychoice.com"
            },
"Groceries": {
                "Company Name": "http://sendmychoice.com"
            },
"Books": {
                "Company Name": "http://sendmychoice.com"
            },
"Pickles": {
                "Company Name": "http://sendmychoice.com"
            },
"Furniture & Crafts": {
                "Company Name": "http://sendmychoice.com"
            }

        }

    }
};

const countrySelect = document.getElementById("country");
const stateSelect = document.getElementById("state");
const citySelect = document.getElementById("city");
const areaSelect = document.getElementById("area");
const goBtn = document.getElementById("goBtn");

// Reset helper function
function resetDropdown(dropdown, placeholder) {
    dropdown.innerHTML = `<option value="">${placeholder}</option>`;
    dropdown.disabled = true;
}

// 1. Update States based on Country
function updateStates() {
    resetDropdown(stateSelect, "Select State");
    resetDropdown(citySelect, "Select City");
    resetDropdown(areaSelect, "Select Area");
    goBtn.disabled = true;

    const selectedCountry = countrySelect.value;
    if (selectedCountry && locationData[selectedCountry]) {
        stateSelect.disabled = false;
        Object.keys(locationData[selectedCountry]).forEach(state => {
            stateSelect.options[stateSelect.options.length] = new Option(state, state);
        });
    }
}

// 2. Update Cities based on State
function updateCities() {
    resetDropdown(citySelect, "Select City");
    resetDropdown(areaSelect, "Select Area");
    goBtn.disabled = true;

    const selectedCountry = countrySelect.value;
    const selectedState = stateSelect.value;

    if (selectedState && locationData[selectedCountry][selectedState]) {
        citySelect.disabled = false;
        Object.keys(locationData[selectedCountry][selectedState]).forEach(city => {
            citySelect.options[citySelect.options.length] = new Option(city, city);
        });
    }
}

// 3. Update Areas based on City
function updateAreas() {
    resetDropdown(areaSelect, "Select Area");
    goBtn.disabled = true;

    const selectedCountry = countrySelect.value;
    const selectedState = stateSelect.value;
    const selectedCity = citySelect.value;

    if (selectedCity && locationData[selectedCountry][selectedState][selectedCity]) {
        areaSelect.disabled = false;
        Object.keys(locationData[selectedCountry][selectedState][selectedCity]).forEach(area => {
            areaSelect.options[areaSelect.options.length] = new Option(area, area);
        });
    }
}

// 4. Enable Go Button when Area is selected
function enableGoButton() {
    if (areaSelect.value) {
        goBtn.disabled = false;
    } else {
        goBtn.disabled = true;
    }
}

// 5. Redirect to the URL mapped to the selected Area
function navigateToUrl() {
    const selectedCountry = countrySelect.value;
    const selectedState = stateSelect.value;
    const selectedCity = citySelect.value;
    const selectedArea = areaSelect.value;

    const targetUrl = locationData[selectedCountry][selectedState][selectedCity][selectedArea];
    
    if (targetUrl) {
        window.location.href = targetUrl; // Use window.open(targetUrl, '_blank') to open in a new tab
    }
}
</script>

</body>
</html>
